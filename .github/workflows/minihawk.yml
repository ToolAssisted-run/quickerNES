name: miniHawk waterbox core

# The core as miniHawk actually ships it: a sandboxed core.wbx package.
#
# Both jobs run only over roms that are FREE TO DISTRIBUTE and vendored in this
# repository, so they need nothing provisioned and can run on public runners.
# The full witness set replays commercial-rom movies and is a pre-release gate
# run locally (minihawk/tests/run-level-b.sh --set full).

on:
  pull_request:
    branches: [ "main" ]
    paths: [ "waterbox/**", "minihawk/**", "source/**", ".github/workflows/minihawk.yml" ]
  push:
    branches: [ "main" ]
    paths: [ "waterbox/**", "minihawk/**", "source/**", ".github/workflows/minihawk.yml" ]
  workflow_dispatch:
  schedule:
    # 04:00 UTC. A nightly is published only when main moved since the last one;
    # the reusable workflow checks, so an unchanged core costs one idle run.
    - cron: '0 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MINIHAWK_REF: main

jobs:

  core-gate:
    # The fast half: the sandboxed core must emulate byte-identically to the
    # original shared library, and survive a savestate round-trip around every
    # frame. No .NET, Mono or X involved.
    name: core gate (equivalence + savestates)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Check out miniHawk (for the miniBox waterbox host and toolchain)
        uses: actions/checkout@v6
        with:
          repository: ToolAssisted-run/chimera
          ref: ${{ env.MINIHAWK_REF }}
          path: minihawk-checkout
          submodules: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build build-essential python3

      - name: Check out miniBox
        working-directory: minihawk-checkout
        run: git submodule update --init extern/tools/chimera-common-minibox

      # The C++ guest toolchain (musl + libstdc++ built for the sandbox) is the
      # slow part of the build and changes only when miniBox does.
      - name: Cache the guest toolchain
        uses: actions/cache@v4
        with:
          path: minihawk-checkout/extern/tools/chimera-common-minibox/build/meson-cpp
          key: guest-cpp-${{ runner.os }}-${{ hashFiles('minihawk-checkout/extern/tools/chimera-common-minibox/.git') }}-${{ hashFiles('minihawk-checkout/extern/tools/chimera-common-minibox/meson.build') }}

      - name: Build miniBox (host + C++ guest toolchain)
        run: |
          mb="$PWD/minihawk-checkout/extern/tools/chimera-common-minibox"
          [ -f "$mb/build/meson-cpp/build.ninja" ] || meson setup "$mb/build/meson-cpp" "$mb" -Dguest_cpp=true
          meson compile -C "$mb/build/meson-cpp"

      - name: Build the native reference (libquicknes) and the drivers
        run: |
          mb="$PWD/minihawk-checkout/extern/tools/chimera-common-minibox"
          meson setup build/meson-native -Dwaterbox=true "-Dminibox_dir=$mb"
          ninja -C build/meson-native

      - name: Build the waterbox core
        run: |
          mb="$PWD/minihawk-checkout/extern/tools/chimera-common-minibox"
          sh waterbox/setup-guest.sh -m "$mb"
          ninja -C build/meson-guest core.wbx

      - name: Core gate over the free-to-distribute roms
        run: ./waterbox/run-gate.sh

      - name: Upload core.wbx
        uses: actions/upload-artifact@v7
        with:
          name: core-wbx
          path: |
            waterbox/bin/core.wbx
            waterbox/waterbox.config
          retention-days: 90

  frontend-witness:
    # The other half: real movies replayed through the whole frontend (EmuHawk
    # headless under Mono + Xvfb, loading the package through miniHawk's generic
    # waterbox adapter), with the final RAM compared byte-for-byte against
    # goldens that were recorded from the native core. Savestate faithfulness is
    # NOT retested here - core-gate above proves it directly. Builds all of
    # miniHawk, so it takes minutes; the core gate gives fast feedback meanwhile.
    name: frontend witness (free rom set)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Check out miniHawk
        uses: actions/checkout@v6
        with:
          repository: ToolAssisted-run/chimera
          ref: ${{ env.MINIHAWK_REF }}
          path: minihawk-checkout
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build build-essential cmake pkg-config python3 \
            mono-complete xvfb \
            libgl1-mesa-dev libx11-dev libxext-dev libasound2-dev

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Build miniHawk native dependencies
        working-directory: minihawk-checkout
        run: |
          meson setup build/meson-linux --prefix "$PWD/build" --libdir dll
          meson compile -C build/meson-linux
          meson install -C build/meson-linux

      - name: Build the miniHawk solution
        working-directory: minihawk-checkout
        run: dotnet build source/gui/Chimera.sln -c Release /nodeReuse:false -p:UseSharedCompilation=false

      - name: Cache the guest toolchain
        uses: actions/cache@v4
        with:
          path: minihawk-checkout/extern/tools/chimera-common-minibox/build/meson-cpp
          key: guest-cpp-${{ runner.os }}-${{ hashFiles('minihawk-checkout/extern/tools/chimera-common-minibox/.git') }}-${{ hashFiles('minihawk-checkout/extern/tools/chimera-common-minibox/meson.build') }}

      - name: Build miniBox (host + C++ guest toolchain)
        run: |
          mb="$PWD/minihawk-checkout/extern/tools/chimera-common-minibox"
          [ -f "$mb/build/meson-cpp/build.ninja" ] || meson setup "$mb/build/meson-cpp" "$mb" -Dguest_cpp=true
          meson compile -C "$mb/build/meson-cpp"

      - name: Build and install the waterbox core package
        # The commit is the core's authoritative version: this build is the one that
        # publishes the artifact, so what it stamps is what a movie can cite. A package
        # built by hand stamps "+local" instead and can never be mistaken for this one.
        env:
          CORE_VERSION: ${{ github.sha }}
        run: ./waterbox/build-package.sh -r "$PWD/minihawk-checkout"

      # The free-set movies are committed, so nothing is converted here; if the
      # controller declaration changed without regenerating them, every test
      # desyncs and this fails loudly, which is the point.
      - name: Witness - free rom set
        working-directory: ./minihawk/tests
        run: ./run-level-b.sh --minihawk-root "$GITHUB_WORKSPACE/minihawk-checkout"

      - name: Publish the core package
        # Only from a gate that passed: an artifact nobody vouched for is worse than
        # no artifact. The version inside it is the commit above.
        uses: actions/upload-artifact@v7
        with:
          name: quickernes-${{ github.sha }}
          path: minihawk-checkout/build/Cores/quickernes.chimeraCore
          if-no-files-found: error

      - name: Upload witness work dir on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-witness-work
          path: minihawk/tests/work/

  publish:
    # What the gates passed, published as this core's own release: a rolling
    # `dev` on every green push to main, an immutable `nightly-YYYY-MM-DD` from
    # the scheduled run. Chimera ships no cores; its Core Manager downloads
    # them from here.
    #
    # The logic is Chimera's tools/publish-core.sh, called through one reusable
    # workflow, so all fifteen cores publish the same way and there is one place
    # to change it.
    name: publish
    needs: [ core-gate, frontend-witness ]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ToolAssisted-run/chimera/.github/workflows/publish-core.yml@main
    with:
      core-id: quickernes
      artifact: quickernes-${{ github.sha }}
      package: quickernes.chimeraCore
